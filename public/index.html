<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · CEIT Scheduler</title><link rel="icon" type="image/png" href="assets/favicon.png"><link rel="stylesheet" href="css/style.css"><script src="js/theme.js"></script></head><body class="login" data-mode="admin"><button class="sw" onclick="toggleTheme()" aria-label="Toggle theme" style="position:fixed;top:18px;right:18px"><i></i></button>
